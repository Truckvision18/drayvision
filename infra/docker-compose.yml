# Local / pilot stack: api + db + cache (+ routing under the `routing` profile).
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#   docker compose -f infra/docker-compose.yml --env-file .env --profile routing up -d   # once tiles are built
#
name: drayvision

include:
  - path: ../services/routing/docker-compose.valhalla.yml

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drayvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drayvision}
      POSTGRES_DB: ${POSTGRES_DB:-drayvision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DRAYVISION_ENV: ${DRAYVISION_ENV:-dev}
      # In-network addresses override any localhost values from .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-drayvision}:${POSTGRES_PASSWORD:-drayvision}@db:5432/${POSTGRES_DB:-drayvision}
      REDIS_URL: redis://cache:6379
      VALHALLA_URL: http://valhalla:8002
      GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ../data:/app/data:ro
      - ../services/routing:/app/services/routing:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
