# Phase 4 — self-hosted Valhalla. Included by infra/docker-compose.yml under the `routing`
# profile, because it serves a tile set that must be built first:
#
#   services/routing/build-tiles.sh services/routing/extracts/<region>-<YYYY-MM-DD>.osm.pbf <sha256>
#   make up-routing
#
# Tiles are built ONCE by build-tiles.sh (reproducible, dated) and served read-only here; the
# container is told never to rebuild on start. Keep the tag in step with build-tiles.sh and
# requirements.txt.
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:${VALHALLA_VERSION:-3.9.1}
    profiles: ["routing"]
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    volumes:
      - ./valhalla_tiles:/custom_files
    environment:
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
      build_tar: "False"
      server_threads: "${VALHALLA_THREADS:-2}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
